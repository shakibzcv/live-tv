<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 26" width="36" height="26">
  <defs>
    <linearGradient id="globe-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181b22"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </linearGradient>
    <linearGradient id="globe-sphere" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="globe-land" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <clipPath id="globe-clip">
      <circle cx="18" cy="13" r="9.5"/>
    </clipPath>
  </defs>

  <!-- Background Canvas -->
  <rect width="36" height="26" rx="3" fill="url(#globe-bg)"/>

  <!-- Subtle Outer Ring Glow -->
  <circle cx="18" cy="13" r="10.2" fill="none" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.35"/>

  <!-- Ocean Sphere -->
  <circle cx="18" cy="13" r="9.5" fill="url(#globe-sphere)"/>

  <!-- Continents & Coordinates -->
  <g clip-path="url(#globe-clip)">
    <!-- Americas -->
    <path d="M12,6 C13.5,6.5 14.5,8 14,9.5 C13.5,10.5 12,11.5 12.5,13 C12.8,14 14.5,15.5 14,17.5 C13.5,19 12,19.5 11,18.5 C10.2,17.5 10.5,15.5 10,13.5 C9.5,11.5 9.5,9.5 10.5,7.5 Z" fill="url(#globe-land)"/>
    <!-- Europe, Africa, Asia -->
    <path d="M17,5.5 C19.5,5 23.5,6.5 24.5,9 C25,10.2 23,11.5 21.5,11 C20,10.5 19.5,12 21,13.5 C22,14.5 21.5,17 20,18.5 C19,19.5 17.5,19 17,17 C16.5,14.5 15,13.5 16,11.5 C17,9.5 15.5,7.5 17,5.5 Z" fill="url(#globe-land)"/>
    <!-- Australasia -->
    <circle cx="23.5" cy="17" r="1.5" fill="url(#globe-land)"/>

    <!-- Latitude / Longitude Overlay Lines -->
    <line x1="8.5" y1="13" x2="27.5" y2="13" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.3"/>
    <ellipse cx="18" cy="13" rx="4.5" ry="9.5" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.3"/>
    <line x1="10" y1="8.5" x2="26" y2="8.5" stroke="#ffffff" stroke-width="0.4" stroke-opacity="0.2"/>
    <line x1="10" y1="17.5" x2="26" y2="17.5" stroke="#ffffff" stroke-width="0.4" stroke-opacity="0.2"/>
  </g>

  <!-- Border Frame -->
  <rect x="0.5" y="0.5" width="35" height="25" rx="2.5" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.12"/>
</svg>
